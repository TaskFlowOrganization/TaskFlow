version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskflow
      DB_USER: postgres
      DB_PASS: postgres
      DEFAULT_ADMIN_USER: user
      DEFAULT_ADMIN_PASS: 1234
    depends_on:
      - postgres

volumes:
  postgres_data: